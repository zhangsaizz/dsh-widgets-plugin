<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>会话监控 · 桌面挂件</title>
<style>
  /* Standalone desktop widget page — served by the session-monitor host half
     at /_dsh/session-monitor/widget. Self-contained (no framework, no host
     theme tokens): the palette mirrors the in-app overlay widget so the two
     monitors read the same. The page is designed for a transparent,
     frameless, always-on-top desktop window (Tauri shell), but also works
     as a plain browser tab.
     Main view: the notification INBOX (session events that may need the
     user's attention, durable + ackable — see desktop-notifications.ts).
     Secondary view: the session list (the original monitor, unchanged).
     Settings are SHARED with the web widget via the Host store
     (/_dsh/session-monitor/settings); only the refresh interval and the
     inbox level toggles are desktop-local. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* The hidden attribute must always win, even against class rules that set
     `display` explicitly (e.g. .settings { display: flex }) — the UA rule is
     overridden by any author display declaration, which would leave panels
     permanently visible. */
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid #4f8cff; outline-offset: 1px; }
  html, body {
    background: transparent;
    height: 100%;
    overflow: hidden;
  }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    font-size: 13px;
    color: #e8eaf0;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    flex-direction: column;
  }
  button { font-family: inherit; }

  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    margin: 8px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 14px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0) 42%),
      rgba(24, 26, 32, 0.92);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.08),
      0 8px 20px rgba(0, 0, 0, 0.1),
      0 24px 56px rgba(0, 0, 0, 0.14);
    overflow: hidden;
    position: relative;
  }
  .panel::before {
    content: '';
    position: absolute;
    inset: 0 0 auto 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
    pointer-events: none;
  }

  /* ── header ─────────────────────────────────────────── */
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 8px 8px 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    flex: none;
  }
  .header.draggable { cursor: grab; }
  .header.draggable:active { cursor: grabbing; }
  .titleDot {
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 3px;
    background: #4f8cff;
    box-shadow: 0 0 8px rgba(79, 140, 255, 0.45);
  }
  .title {
    flex: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .badge {
    flex: none;
    min-width: 17px;
    height: 17px;
    padding: 0 5px;
    border-radius: 9px;
    background: #ff6b6b;
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
    line-height: 17px;
    text-align: center;
    box-shadow: 0 0 10px rgba(255, 107, 107, 0.45);
  }
  .spacer { flex: 1; }
  .iconBtn {
    flex: none;
    width: 24px;
    height: 24px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: rgba(232, 234, 240, 0.62);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }
  .iconBtn:hover { background: rgba(255, 255, 255, 0.1); color: #e8eaf0; }
  .iconBtn:active { transform: scale(0.9); }
  .iconBtn.spinning { animation: spinIcon 0.5s linear; }
  .iconBtn.on { color: #4f8cff; }
  @keyframes spinIcon { to { transform: rotate(360deg); } }

  /* ── tab bar ────────────────────────────────────────── */
  .tabs {
    flex: none;
    display: flex;
    gap: 4px;
    padding: 6px 10px 4px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .tab {
    flex: 1;
    padding: 5px 0;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: rgba(232, 234, 240, 0.6);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
  }
  .tab:hover { background: rgba(255, 255, 255, 0.06); }
  .tab.active { background: rgba(255, 255, 255, 0.1); color: #e8eaf0; }
  .tab.active::after {
    content: '';
    position: absolute;
    left: 30%; right: 30%; bottom: -5px;
    height: 2px;
    border-radius: 1px;
    background: #4f8cff;
  }
  .tab .tabBadge {
    display: inline-block;
    min-width: 15px;
    height: 15px;
    padding: 0 4px;
    margin-left: 5px;
    border-radius: 8px;
    background: #ff6b6b;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    line-height: 15px;
  }

  /* ── status banner ──────────────────────────────────── */
  .banner {
    flex: none;
    margin: 8px 10px 0;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 11.5px;
    background: rgba(255, 107, 107, 0.14);
    color: #ff8f8f;
    border: 1px solid rgba(255, 107, 107, 0.25);
  }

  /* ── monitoring-off overlay ─────────────────────────── */
  /* Covers the tab bar + views when the shared "desktop monitoring" switch is
     off (the header stays usable so settings can be reopened). z-index sits
     below the settings popover (20) so the panel floats above the overlay. */
  .monitorOff {
    position: absolute;
    left: 0;
    right: 0;
    top: 42px;
    bottom: 0;
    z-index: 15;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 24px;
    text-align: center;
    background: rgba(24, 26, 32, 0.96);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .monitorOff .big { font-size: 26px; line-height: 1; }
  .monitorOff .msg { font-size: 13px; font-weight: 600; }
  .monitorOff .sub { font-size: 10.5px; color: rgba(232, 234, 240, 0.5); max-width: 230px; line-height: 1.5; }
  .monitorOff button {
    margin-top: 6px;
    padding: 6px 16px;
    border: none;
    border-radius: 8px;
    background: #4f8cff;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .monitorOff button:hover { filter: brightness(1.08); }

  /* ── views ──────────────────────────────────────────── */
  .view {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 6px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
  }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 3px; }
  .empty {
    padding: 26px 12px;
    text-align: center;
    font-size: 12px;
    color: rgba(232, 234, 240, 0.5);
  }
  .empty .big { font-size: 22px; display: block; margin-bottom: 6px; }
  .empty .sub { display: block; margin-top: 3px; font-size: 10.5px; color: rgba(232, 234, 240, 0.35); }
  .footer {
    flex: none;
    padding: 6px 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 10.5px;
    color: rgba(232, 234, 240, 0.5);
  }
  .textBtn {
    border: none;
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 10.5px;
    font-weight: 600;
    cursor: pointer;
    color: #e8eaf0;
    background: rgba(255, 255, 255, 0.1);
  }
  .textBtn:hover { background: rgba(255, 255, 255, 0.16); }
  .textBtn:active { background: rgba(255, 255, 255, 0.22); }
  .textBtn:disabled { opacity: 0.4; cursor: default; }
  .footer > span:first-child {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .search {
    flex: none;
    margin: 6px 10px 0;
    padding: 6px 9px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
    color: #e8eaf0;
    font-size: 12px;
    outline: none;
  }
  .search::placeholder { color: rgba(232, 234, 240, 0.4); }
  .search:focus { border-color: rgba(79, 140, 255, 0.55); }

  /* ── notification rows ──────────────────────────────── */
  .nrow {
    --accent: #f5b544;
    display: flex;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 10px;
    cursor: pointer;
    position: relative;
    transition: background 120ms ease;
  }
  .nrow:hover { background: rgba(255, 255, 255, 0.07); }
  .nrow:active { background: rgba(255, 255, 255, 0.1); }
  .nrow.unread { border-left: 3px solid var(--accent); background: rgba(255, 255, 255, 0.03); }
  .nrow.read { opacity: 0.55; }
  .nrow .icon {
    flex: none;
    width: 22px;
    height: 22px;
    border-radius: 7px;
    font-size: 11.5px;
    line-height: 22px;
    text-align: center;
    background: rgba(255, 255, 255, 0.07);
    color: var(--accent);
    font-style: normal;
  }
  .nrow .main { flex: 1; min-width: 0; }
  .nrow .kindRow { display: flex; align-items: center; gap: 6px; }
  .nrow .kind { font-size: 11px; font-weight: 700; color: var(--accent); }
  .nrow .tag {
    font-size: 9px;
    line-height: 1.5;
    padding: 0 4px;
    border-radius: 3px;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.1);
    color: rgba(232, 234, 240, 0.62);
  }
  .nrow .tag.p0 { background: rgba(255, 107, 107, 0.16); color: #ff8f8f; }
  .nrow .tag.p1 { background: rgba(245, 181, 68, 0.14); color: #f5b544; }
  .nrow .tag.p2 { background: rgba(255, 255, 255, 0.1); color: rgba(232, 234, 240, 0.55); }
  .nrow .tag.resolved { background: rgba(61, 214, 140, 0.14); color: #3dd68c; }
  .nrow .round { font-size: 9.5px; color: rgba(232, 234, 240, 0.45); }
  .nrow .sessTitle {
    font-size: 11.5px;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nrow .meta { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
  .nrow .time { font-size: 10px; color: rgba(232, 234, 240, 0.4); }
  .nrow .actions { margin-left: auto; display: flex; gap: 5px; flex: none; }
  .act {
    border: none;
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 10.5px;
    font-weight: 600;
    cursor: pointer;
    color: #e8eaf0;
    background: rgba(255, 255, 255, 0.1);
  }
  .act:hover { background: rgba(255, 255, 255, 0.18); }
  .act:active { background: rgba(255, 255, 255, 0.24); }
  .act.primary { background: #4f8cff; color: #fff; }
  .act.primary:hover { filter: brightness(1.1); }
  .act.primary:active { filter: brightness(0.95); }
  .readGroup { border-top: 1px dashed rgba(255, 255, 255, 0.12); margin-top: 4px; padding-top: 4px; }
  .readToggle {
    width: 100%;
    border: none;
    background: none;
    cursor: pointer;
    padding: 5px 8px;
    text-align: left;
    font-size: 10.5px;
    color: rgba(232, 234, 240, 0.5);
  }
  .readToggle:hover { color: #e8eaf0; }

  /* Inbox row actions reveal on hover (always visible on touch / no-hover). */
  @media (hover: hover) {
    .nrow .actions {
      opacity: 0;
      transform: translateX(4px);
      transition: opacity 120ms ease, transform 120ms ease;
    }
    .nrow:hover .actions,
    .nrow:focus-within .actions { opacity: 1; transform: none; }
  }

  /* Inbox group-by-session mode. */
  .ngroupHead {
    display: flex;
    align-items: center;
    gap: 7px;
    width: 100%;
    margin: 4px 0 2px;
    padding: 6px 9px;
    border: none;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
    color: #e8eaf0;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
  }
  .ngroupHead:hover { background: rgba(255, 255, 255, 0.09); }
  .ngroupHead:active { background: rgba(255, 255, 255, 0.12); }
  .ngroupChevron {
    flex: none;
    font-size: 10px;
    color: rgba(232, 234, 240, 0.55);
    transition: transform 120ms ease;
  }
  .ngroupHead.open .ngroupChevron { transform: rotate(90deg); }
  .ngroupHead .gtitle {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ngroupCount {
    flex: none;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 8px;
    background: #ff6b6b;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    line-height: 16px;
    text-align: center;
  }
  .ngroupBody { display: flex; flex-direction: column; }

  /* ── session rows (original monitor) ────────────────── */
  .row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 120ms ease;
  }
  .row:hover { background: rgba(255, 255, 255, 0.07); }
  .row:active { background: rgba(255, 255, 255, 0.1); }
  .dot {
    flex: none;
    width: 8px;
    height: 8px;
    margin-top: 4px;
    border-radius: 50%;
    background: rgba(232, 234, 240, 0.35);
  }
  .dotRunning {
    background: #3dd68c;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .dotDone { background: #f5b544; }
  .dotPending { background: #ff9f43; }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(61, 214, 140, 0.4); }
    50% { opacity: 0.55; box-shadow: 0 0 0 4px transparent; }
  }
  .rowMain { flex: 1; min-width: 0; }
  .rowTitle {
    font-size: 12.5px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rowMeta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
    flex-wrap: wrap;
  }
  .badgeSm {
    flex: none;
    font-size: 10px;
    line-height: 1.4;
    padding: 0 5px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.1);
    color: rgba(232, 234, 240, 0.62);
  }
  .subBadge {
    background: rgba(179, 136, 255, 0.16);
    color: #b388ff;
    font-weight: 600;
  }
  .pendingBadge {
    background: rgba(255, 159, 67, 0.16);
    color: #ff9f43;
    font-weight: 600;
  }
  .status { font-size: 11px; color: rgba(232, 234, 240, 0.72); }
  .statusSub { color: #b388ff; }
  .time {
    font-size: 11px;
    color: rgba(232, 234, 240, 0.4);
    margin-left: auto;
    white-space: nowrap;
  }

  /* Task-execution progress: thin animated bar + label under the row title for
     rows with work in flight (running turn / running subagents). Indeterminate
     — no percent signal exists — so the sweep says "executing" and the label
     names what. Accents match the status dots: green = turn, violet = sub. */
  .progress { margin-top: 5px; min-width: 0; }
  .progressBar {
    position: relative;
    height: 3px;
    border-radius: 2px;
    overflow: hidden;
    background: rgba(61, 214, 140, 0.18);
  }
  .progressBar.progressSub { background: rgba(179, 136, 255, 0.18); }
  .progressBar::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: -45%;
    width: 45%;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, #3dd68c, transparent);
    animation: progressSweep 1.15s ease-in-out infinite;
  }
  .progressBar.progressSub::after {
    background: linear-gradient(90deg, transparent, #b388ff, transparent);
  }
  /* GOAL-mode progress: DETERMINATE — the .progressFill shows rounds-started /
     round-cap as a real percentage, so the sweep is suppressed. Blue =
     active, amber = paused, red = blocked. */
  .progressBar.progressGoal { background: rgba(79, 140, 255, 0.18); }
  .progressBar.progressGoalPaused { background: rgba(245, 181, 68, 0.18); }
  .progressBar.progressGoalBlocked { background: rgba(255, 107, 107, 0.18); }
  .progressBar.progressGoal::after,
  .progressBar.progressGoalPaused::after,
  .progressBar.progressGoalBlocked::after { display: none; }
  .progressFill {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    border-radius: 2px;
    background: #4f8cff;
    transition: width 320ms ease;
  }
  .progressBar.progressGoalPaused .progressFill { background: #f5b544; }
  .progressBar.progressGoalBlocked .progressFill { background: #ff6b6b; }
  @keyframes progressSweep {
    from { left: -45%; }
    to { left: 100%; }
  }
  .progressLabel {
    margin-top: 3px;
    font-size: 10px;
    line-height: 1.4;
    color: rgba(232, 234, 240, 0.52);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── settings popover ───────────────────────────────── */
  .settings {
    position: absolute;
    right: 10px;
    top: 76px;
    z-index: 20;
    width: 240px;
    max-height: calc(100% - 88px);
    overflow-y: auto;
    padding: 12px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 12px;
    background: rgba(30, 32, 40, 0.97);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
    display: flex;
    flex-direction: column;
    gap: 9px;
    font-size: 12px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
  }
  .settings .sec {
    font-size: 10px;
    color: rgba(232, 234, 240, 0.4);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 4px;
  }
  .settings label { display: flex; flex-direction: column; gap: 4px; color: rgba(232, 234, 240, 0.72); }
  .settings label.check { flex-direction: row; align-items: center; gap: 6px; cursor: pointer; }
  .settings select, .settings input[type="number"] {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: #e8eaf0;
    border-radius: 7px;
    padding: 5px 7px;
    font-size: 12px;
    outline: none;
  }
  .settings input[type="checkbox"] { accent-color: #4f8cff; }
  .settings .hint { font-size: 10.5px; color: rgba(232, 234, 240, 0.45); }
  .reset {
    border: none;
    border-radius: 7px;
    padding: 6px 0;
    font-size: 12px;
    font-weight: 600;
    color: #e8eaf0;
    background: rgba(255, 255, 255, 0.1);
    cursor: pointer;
  }
  .reset:hover { background: rgba(255, 255, 255, 0.16); }

  /* ── toast stack ────────────────────────────────────── */
  .toasts {
    position: fixed;
    top: 64px;
    right: 20px;
    z-index: 10010;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 300px;
    max-width: calc(100vw - 28px);
    max-height: calc(100vh - 90px);
    overflow-y: auto;
    pointer-events: none;
  }
  .toast {
    pointer-events: auto;
    --toast-accent: #f5b544;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 12px;
    background: rgba(30, 32, 40, 0.96);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1), 0 10px 28px rgba(0, 0, 0, 0.24);
    padding: 10px 12px;
    animation: toastIn 200ms ease-out;
    position: relative;
  }
  .toast::before {
    content: '';
    position: absolute;
    left: 0;
    top: 9px;
    bottom: 9px;
    width: 3px;
    border-radius: 2px;
    background: var(--toast-accent);
  }
  .toastApproval   { --toast-accent: #ff9f43; }
  .toastQuestion   { --toast-accent: #4f8cff; }
  .toastPlanReview { --toast-accent: #b388ff; }
  .toastSubagent   { --toast-accent: #b388ff; }
  .toastError      { --toast-accent: #ff6b6b; }
  .toastAborted    { --toast-accent: #9aa0ab; }
  .toastBlocked    { --toast-accent: #ff9f43; }
  .toastMaxTokens  { --toast-accent: #4dd0e1; }
  .toastInterrupted{ --toast-accent: #7d93c4; }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .toast.out {
    opacity: 0;
    transform: translateY(-6px) scale(0.98);
    transition: opacity 160ms ease, transform 160ms ease;
  }
  .toastHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .toastTitle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    min-width: 0;
  }
  .toastIcon { color: var(--toast-accent); font-style: normal; font-size: 14px; line-height: 1; }
  .toastTime { font-size: 10.5px; color: rgba(232, 234, 240, 0.4); white-space: nowrap; }
  .toastBody {
    margin-top: 4px;
    font-size: 12.5px;
    line-height: 1.45;
    color: #e8eaf0;
    word-break: break-all;
  }
  .toastActions { display: flex; gap: 8px; margin-top: 9px; }
  .jumpBtn, .dismissBtn {
    flex: 1;
    border: none;
    border-radius: 7px;
    padding: 6px 0;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .jumpBtn { color: #fff; background: #4f8cff; }
  .jumpBtn:hover { filter: brightness(1.08); }
  .toastDone .jumpBtn, .toastAborted .jumpBtn, .toastInterrupted .jumpBtn {
    color: #e8eaf0;
    background: rgba(255, 255, 255, 0.1);
  }
  .toastDone .jumpBtn:hover, .toastAborted .jumpBtn:hover, .toastInterrupted .jumpBtn:hover {
    background: rgba(255, 255, 255, 0.16);
  }
  .dismissBtn { color: #e8eaf0; background: rgba(255, 255, 255, 0.1); }
  .dismissBtn:hover { background: rgba(255, 255, 255, 0.16); }
</style>
</head>
<body>
  <div class="panel">
    <header class="header" id="header">
      <span class="titleDot"></span>
      <span class="title">会话监控</span>
      <span class="badge" id="unreadBadge" hidden>0</span>
      <span class="spacer"></span>
      <button class="iconBtn" id="refreshBtn" title="立即刷新">⟳</button>
      <button class="iconBtn" id="pinBtn" title="置顶">📌</button>
      <button class="iconBtn" id="settingsBtn" title="设置">⚙</button>
      <button class="iconBtn" id="closeBtn" title="隐藏">✕</button>
    </header>
    <div class="tabs">
      <button class="tab active" id="tabInbox">待处理<span class="tabBadge" id="tabInboxBadge" hidden>0</span></button>
      <button class="tab" id="tabSessions">会话</button>
    </div>
    <div class="banner" id="banner" hidden>连接 Harness 失败，正在重试…</div>
    <div class="monitorOff" id="monitorOff" hidden>
      <span class="big">⏸</span>
      <span class="msg">桌面端会话监控已关闭</span>
      <span class="sub">挂件已暂停轮询与提醒。可在网页版设置或本面板「设置」中重新开启</span>
      <button id="monitorOffEnable">开启监控</button>
    </div>
    <div class="view" id="inboxView">
      <input class="search" id="inboxSearch" type="search" placeholder="搜索通知…" />
      <div class="list" id="inboxList"></div>
      <div class="empty" id="inboxEmpty" hidden><span class="big">✓</span>没有需要处理的事项<span class="sub">待处理通知会出现在这里</span></div>
      <div class="footer" id="inboxFooter">
        <span id="inboxFooterHint"></span>
        <button class="textBtn" id="groupBtn" title="按会话分组 / 平铺">分组</button>
        <button class="textBtn" id="ackAllBtn">全部已读</button>
      </div>
    </div>
    <div class="view" id="sessionView" hidden>
      <input class="search" id="sessionSearch" type="search" placeholder="搜索会话…" />
      <div class="list" id="sessionList"></div>
      <div class="empty" id="sessionEmpty" hidden><span class="big">·</span>暂无活动会话<span class="sub">运行中的会话会置顶显示</span></div>
      <div class="footer" id="sessionFooter">
        <span id="sessionFooterHint"></span>
      </div>
    </div>
    <div class="settings" id="settingsPanel" hidden>
      <span class="hint">以下选项与网页版共享，两边改动实时同步</span>
      <label class="check"><input type="checkbox" id="setDesktopMonitor" /> 桌面端会话监控</label>
      <label class="check"><input type="checkbox" id="setNotify" /> 完成提醒</label>
      <label>通知方式
        <select id="setNotifyMode">
          <option value="auto">自动消失</option>
          <option value="confirm">需确认</option>
        </select>
      </label>
      <label>自动消失（秒）
        <input type="number" id="setAutoDismiss" min="2" max="60" step="1" />
      </label>
      <label class="check"><input type="checkbox" id="setSound" /> 完成提醒提示音</label>
      <label class="check"><input type="checkbox" id="setRunningOnly" /> 只显示运行中</label>
      <label class="check"><input type="checkbox" id="setSubagents" /> 显示子代理会话</label>
      <label>时间范围（分钟，0=全部）
        <input type="number" id="setWindow" min="0" step="5" />
      </label>
      <span class="sec">待处理通知</span>
      <label class="check"><input type="checkbox" id="setInboxP0" /> 需要处理（审批/回答/计划/出错等）</label>
      <label class="check"><input type="checkbox" id="setInboxP1" /> 值得看（完成一轮/子代理等）</label>
      <label class="check"><input type="checkbox" id="setInboxP2" /> 信息流（标题变更/新会话）</label>
      <label class="check"><input type="checkbox" id="setAckOnJump" /> 处理后自动已读</label>
      <label class="check"><input type="checkbox" id="setAutoAckOnOpen" /> 打开时自动全部已读</label>
      <span class="hint">以下为本挂件独有</span>
      <label>刷新间隔
        <select id="setPoll">
          <option value="1000">1 秒</option>
          <option value="2000">2 秒</option>
          <option value="3000">3 秒</option>
          <option value="5000">5 秒</option>
        </select>
      </label>
      <button class="reset" id="resetBtn">恢复默认</button>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>

<script>
(function () {
  'use strict'

  var SESSIONS_URL = '/_dsh/session-monitor/sessions'
  var SETTINGS_URL = '/_dsh/session-monitor/settings'
  var JUMP_URL = '/_dsh/session-monitor/jump'
  var NOTIFICATIONS_URL = '/_dsh/session-monitor/notifications'
  var NOTIFICATIONS_ACK_URL = '/_dsh/session-monitor/notifications/ack'
  // Desktop-local cache: last-known shared settings + the refresh interval +
  // the inbox level toggles. The shared fields live on the Host store; only
  // pollMs and inboxLevels are purely local.
  var CACHE_KEY = 'dsh.smon.desktop.settings'
  var MAX_AUTO_TOASTS = 5
  var MAX_CONFIRM_TOASTS = 12

  // Shared defaults — mirror the web widget's DEFAULT_SETTINGS.
  var DEFAULTS = {
    notify: true,
    notifyMode: 'auto',
    autoDismissSec: 8,
    sound: false,
    browserNotify: false,
    runningOnly: false,
    timeWindowMin: 60,
    showDone: true,
    notifyCurrent: false,
    showSubagents: false,
    desktopMonitor: false,
    ackOnJump: true,
    autoAckOnOpen: false,
  }
  // Desktop-local: which notification levels enter the inbox.
  var LEVEL_DEFAULTS = { p0: true, p1: true, p2: false }
  var POLL_DEFAULT_MS = 2000
  var SETTINGS_SYNC_MS = 5000

  // Inbox kind metadata: label / icon / accent color / level. Colors reuse the
  // toast palette so the two surfaces read the same.
  var KINDS = {
    approval:      { label: '等待审批',     icon: '⏳', color: '#ff9f43', level: 'p0' },
    question:      { label: '等待回答',     icon: '❓', color: '#4f8cff', level: 'p0' },
    'plan-review': { label: '等待审阅计划', icon: '📋', color: '#b388ff', level: 'p0' },
    error:         { label: '本轮出错',     icon: '✕',  color: '#ff6b6b', level: 'p0' },
    blocked:       { label: '已阻塞',       icon: '⚠',  color: '#ff9f43', level: 'p0' },
    'max-tokens':  { label: 'Token 上限',   icon: '⛶',  color: '#4dd0e1', level: 'p0' },
    subagent:      { label: '子代理完成',   icon: '⇄',  color: '#b388ff', level: 'p1' },
    done:          { label: '完成一轮',     icon: '✓',  color: '#f5b544', level: 'p1' },
    aborted:       { label: '已中止',       icon: '⏹',  color: '#9aa0ab', level: 'p1' },
    interrupted:   { label: '已中断',       icon: '⏸',  color: '#7d93c4', level: 'p1' },
    title:         { label: '标题变更',     icon: '✎',  color: '#8b91a0', level: 'p2' },
    'new-session': { label: '新会话',       icon: '＋', color: '#7d93c4', level: 'p2' },
  }

  var shared = {}          // effective shared settings (13 fields, from server)
  var inboxLevels = {}     // { p0, p1, p2 } booleans (desktop-local)
  var pollMs = POLL_DEFAULT_MS
  var sessions = []        // latest snapshot rows
  var reasons = {}         // sessionId -> { reason, at, round } (rides the sessions snapshot)
  var tools = {}           // sessionId -> { name, at } — currently-executing tool per session
  var roundCounts = {}     // sessionId -> cumulative finished-round count (NOT TTL-pruned)
  var prevRunning = {}     // sessionId -> true while running (edge detection)
  var lastToastedRound = {} // sessionId -> round already notified
  var notes = []           // latest inbox records (server order, oldest first)
  var tab = 'inbox'        // 'inbox' | 'sessions'
  var autoAcked = false    // autoAckOnOpen already ran for this boot
  var lastTrayUnread = -1  // last count sent to the Tauri tray (skip repeats)
  var failCount = 0
  var toastSeq = 0
  var pinOn = true
  var pollTimer = null
  var settingsTimer = null
  var paused = false       // heavy polls suspended (window hidden / tab hidden)
  var slowTimer = null     // slow notifications-only poll while paused (tray badge)
  var chimeCtx = null      // shared AudioContext (browsers cap ~6 per page)
  var HIDDEN_NOTIFY_MS = 15000
  // UI state: sync status, inbox grouping, per-view search, loading flags.
  var lastSyncAt = 0       // last successful sessions/notifications fetch
  var loaded = { sessions: false, inbox: false }
  var inboxGrouped = true  // inbox grouped by session (toggle in the footer)
  var groupOpen = {}       // sessionId -> group expanded (absent = open)
  var search = { inbox: '', sessions: '' }
  var lastInboxHint = ''
  var lastSessionHint = ''

  // ── Tauri shell bridge (absent in a plain browser) ─────────
  var tauri = (typeof window !== 'undefined' && window.__TAURI__) ? window.__TAURI__ : null

  function currentWindow() {
    return tauri ? tauri.window.getCurrentWindow() : null
  }

  function startDrag(event) {
    if (!tauri || event.target.closest('button')) return
    var w = currentWindow()
    if (!w) return
    w.startDragging().catch(function () {})
  }

  function togglePin() {
    var w = currentWindow()
    if (!w) { pinOn = !pinOn; renderPin(); return }
    w.isAlwaysOnTop().then(function (on) {
      return w.setAlwaysOnTop(!on)
    }).then(function () {
      return w.isAlwaysOnTop()
    }).then(function (on) {
      pinOn = on
      renderPin()
    }).catch(function () {})
  }

  function hideWindow() {
    var w = currentWindow()
    if (!w) { window.close(); return }
    w.hide().then(function () { setPaused(true) }).catch(function () {})
  }

  /** Open the harness web app in the system browser (Tauri: open_in_browser
   *  command; plain browser: new tab). Fallback only. */
  function openBrowser(url) {
    if (tauri) {
      tauri.core.invoke('open_in_browser', { url: url }).catch(function () {
        window.open(url, '_blank')
      })
      return
    }
    window.open(url, '_blank')
  }

  /** Mirror the inbox unread count into the Tauri tray (tooltip + menu status
   *  item); a no-op in a plain browser. Only sends on change — the 2s poll
   *  would otherwise rewrite the tray every cycle. */
  function updateTrayUnread(count) {
    if (!tauri) return
    if (count === lastTrayUnread) return
    lastTrayUnread = count
    tauri.core.invoke('set_tray_unread', { count: count }).catch(function () {})
  }

  // ── shared settings (server-mediated) ───────────────────────
  function loadCache() {
    var stored = null
    try { stored = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null') } catch (e) { /* ignore */ }
    var settings = {}
    for (var key in DEFAULTS) settings[key] = DEFAULTS[key]
    for (var lvl in LEVEL_DEFAULTS) inboxLevels[lvl] = LEVEL_DEFAULTS[lvl]
    if (stored && typeof stored === 'object') {
      if (stored.settings && typeof stored.settings === 'object') {
        for (var key in DEFAULTS) {
          var v = stored.settings[key]
          if (typeof v === 'boolean' || typeof v === 'number' || v === 'auto' || v === 'confirm') {
            settings[key] = v
          }
        }
      }
      if (typeof stored.pollMs === 'number') pollMs = stored.pollMs
      if (typeof stored.inboxGrouped === 'boolean') inboxGrouped = stored.inboxGrouped
      if (stored.inboxLevels && typeof stored.inboxLevels === 'object') {
        for (var lvl in LEVEL_DEFAULTS) {
          var lv = stored.inboxLevels[lvl]
          if (typeof lv === 'boolean') inboxLevels[lvl] = lv
        }
      }
    }
    shared = settings
  }

  function saveCache() {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        settings: shared, pollMs: pollMs, inboxLevels: inboxLevels, inboxGrouped: inboxGrouped,
      }))
    } catch (e) { /* ignore */ }
  }

  /** The shared "desktop monitoring" master switch is off. */
  function isMonitorOff() {
    return shared.desktopMonitor === false
  }

  /** Schedule the polls according to the current state: window-hidden pause
   *  (setPaused) and/or the shared desktop-monitoring master switch. When
   *  monitoring is off, no data poll runs at all — the settings poll
   *  (settingsTimer, separate) keeps running so a web-side re-enable is
   *  picked up within a few seconds. */
  function applyEffective() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
    if (slowTimer) { clearInterval(slowTimer); slowTimer = null }
    if (isMonitorOff()) return
    if (paused) {
      slowTimer = setInterval(pollNotifications, HIDDEN_NOTIFY_MS)
    } else {
      pollTimer = setInterval(pollAll, pollMs)
    }
  }

  /** Pause the heavy polls while the widget window is hidden (Tauri hide /
   *  tray toggle / browser tab hidden): only a slow /notifications poll keeps
   *  the tray badge fresh. Resume on show and refresh immediately. WebView2
   *  never fires `visibilitychange` for a hidden native window, so the pause
   *  is driven by explicit Tauri events plus the page's own hide() calls. */
  function setPaused(p) {
    if (p === paused) return
    paused = p
    applyEffective()
    if (!p && !isMonitorOff()) {
      pollAll()
      pollSettings()
    }
    renderStatus()
  }

  function pollAll() {
    pollSessions()
    pollNotifications()
  }

  /** Merge a patch into the shared settings, persist to the Host store and
   *  cache. The full settings blob is sent so untouched web-side fields
   *  survive the write. */
  function saveSharedSettings(patch) {
    var monitorChanged = false
    for (var key in patch) {
      if (key in DEFAULTS) {
        if (key === 'desktopMonitor' && shared[key] !== patch[key]) monitorChanged = true
        shared[key] = patch[key]
      }
    }
    saveCache()
    fetchJSON(SETTINGS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(shared),
    }).catch(function () {})
    if (monitorChanged) {
      applyEffective()
      renderMonitor()
      render()
    } else {
      render()
    }
  }

  /** Pull the Host store (web-side changes) and apply when different. */
  function pollSettings() {
    fetchJSON(SETTINGS_URL).then(function (body) {
      if (!body || !body.ok || !body.value || typeof body.value !== 'object') return
      var next = body.value
      var changed = false
      var monitorChanged = false
      for (var key in DEFAULTS) {
        var v = next[key]
        if (typeof v === 'boolean' || typeof v === 'number' || v === 'auto' || v === 'confirm') {
          if (shared[key] !== v) {
            if (key === 'desktopMonitor') monitorChanged = true
            shared[key] = v
            changed = true
          }
        }
      }
      if (changed) {
        saveCache()
        if (monitorChanged) {
          applyEffective()
          renderMonitor()
        }
        applyPanelUI()
        render()
      }
    }).catch(function () {})
  }

  function applyPanelUI() {
    document.getElementById('setDesktopMonitor').checked = shared.desktopMonitor !== false
    document.getElementById('setNotify').checked = !!shared.notify
    document.getElementById('setNotifyMode').value = shared.notifyMode === 'confirm' ? 'confirm' : 'auto'
    document.getElementById('setAutoDismiss').value = String(shared.autoDismissSec)
    document.getElementById('setSound').checked = !!shared.sound
    document.getElementById('setRunningOnly').checked = !!shared.runningOnly
    document.getElementById('setSubagents').checked = !!shared.showSubagents
    document.getElementById('setWindow').value = String(shared.timeWindowMin)
    document.getElementById('setInboxP0').checked = !!inboxLevels.p0
    document.getElementById('setInboxP1').checked = !!inboxLevels.p1
    document.getElementById('setInboxP2').checked = !!inboxLevels.p2
    document.getElementById('setAckOnJump').checked = shared.ackOnJump !== false
    document.getElementById('setAutoAckOnOpen').checked = !!shared.autoAckOnOpen
    document.getElementById('setPoll').value = String(pollMs)
  }

  // ── polling ──────────────────────────────────────────────────
  function fetchJSON(url, init) {
    var controller = new AbortController()
    // Generous timeout: the /sessions snapshot can take over a second while
    // cold persisted sessions are probed (budgeted now); aborting mid-snapshot
    // used to blank the whole list every probe burst.
    var timer = setTimeout(function () { controller.abort() }, 10000)
    return fetch(url, Object.assign({ cache: 'no-store', signal: controller.signal }, init || {}))
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status)
        return res.json()
      })
      .finally(function () { clearTimeout(timer) })
  }

  function pollSessions() {
    fetchJSON(SESSIONS_URL).then(function (snap) {
      failCount = 0
      document.getElementById('banner').hidden = true
      // Route envelope: { ok, value: { at, sessions, reasons, tools } } — the
      // turn-end reason table rides the same snapshot as the rows, so the
      // round-reason is fresh at the exact moment the running→false edge is
      // observed (no separate /status poll lagging up to 3s behind).
      var value = snap && snap.value
      var rows = (value && value.sessions) || []
      reasons = (value && value.reasons) || {}
      var nextTools = (value && value.tools) || {}
      if (typeof nextTools === 'object' && nextTools !== null && !Array.isArray(nextTools)) {
        var sanitized = {}
        for (var key in nextTools) {
          var t = nextTools[key]
          if (t && typeof t === 'object' && typeof t.name === 'string' && typeof t.at === 'number') {
            sanitized[key] = { name: t.name, at: t.at }
          }
        }
        tools = sanitized
      }
      var nextRounds = (value && value.rounds) || {}
      if (typeof nextRounds === 'object' && nextRounds !== null && !Array.isArray(nextRounds)) {
        var roundSanitized = {}
        for (var rKey in nextRounds) {
          var rc = nextRounds[rKey]
          if (typeof rc === 'number' && isFinite(rc)) roundSanitized[rKey] = rc
        }
        roundCounts = roundSanitized
      }
      for (var i = 0; i < rows.length; i++) {
        var row = rows[i]
        if (prevRunning[row.sessionId] && !row.running) onRoundFinished(row)
      }
      prevRunning = {}
      for (var j = 0; j < rows.length; j++) {
        if (rows[j].running) prevRunning[rows[j].sessionId] = true
      }
      sessions = rows
      loaded.sessions = true
      lastSyncAt = Date.now()
      renderSessions()
      renderStatus()
    }).catch(function () {
      failCount++
      if (failCount >= 2) document.getElementById('banner').hidden = false
      // Keep the last good list — a transient failure must not blank the list
      // (that would flicker it to empty every network hiccup); the banner
      // already signals the trouble.
      renderSessions()
      renderStatus()
    })
  }

  // ── inbox ────────────────────────────────────────────────────
  function pollNotifications() {
    fetchJSON(NOTIFICATIONS_URL).then(function (snap) {
      var value = snap && snap.value
      if (!value || !Array.isArray(value.notes)) return
      notes = value.notes
      loaded.inbox = true
      lastSyncAt = Date.now()
      renderInbox()
      renderStatus()
      // One-shot: "auto-ack everything on open" (shared setting).
      if (!autoAcked && shared.autoAckOnOpen === true) {
        autoAcked = true
        ackAll()
      }
    }).catch(function () {
      /* keep last list */
      renderStatus()
    })
  }

  /** Is this record still waiting on the user (not acked and not resolved)? */
  function isUnread(note) {
    return !note.ackedAt && !note.resolved
  }

  /** Stable per-record signature — re-render only when something visible
   *  changed (status, kind, minute-granularity recency). */
  function noteSignature(note) {
    return [
      note.id, note.kind, note.title || '',
      isUnread(note) ? 1 : 0, note.resolved ? 1 : 0,
      Math.floor(note.at / 60000),
    ].join('|')
  }

  /** Match a record against the inbox search query (session title / id / kind label). */
  function matchesNote(note, kind, q) {
    return (note.title || note.sessionId).toLowerCase().indexOf(q) !== -1
      || note.sessionId.toLowerCase().indexOf(q) !== -1
      || (kind.label || '').toLowerCase().indexOf(q) !== -1
  }

  function renderInbox() {
    var list = document.getElementById('inboxList')
    var empty = document.getElementById('inboxEmpty')
    var q = (search.inbox || '').toLowerCase()

    // Before the first successful fetch: loading placeholder (once the banner
    // is up, a retrying hint instead of a fake "nothing to do").
    if (!loaded.inbox) {
      empty.hidden = false
      empty.innerHTML = failCount >= 2
        ? '<span class="big">⛔</span>连接失败<span class="sub">正在重试…</span>'
        : '<span class="big">…</span>加载中'
      list.innerHTML = ''
      document.getElementById('ackAllBtn').disabled = true
      document.getElementById('groupBtn').textContent = inboxGrouped ? '平铺' : '分组'
      updateTrayUnread(0)
      lastInboxHint = ''
      renderStatus()
      return
    }

    var visible = []
    var hiddenByLevel = 0
    var hiddenBySearch = 0
    for (var i = 0; i < notes.length; i++) {
      var note = notes[i]
      var kind = KINDS[note.kind]
      if (!kind) { hiddenByLevel++; continue }
      if (!inboxLevels[kind.level]) { hiddenByLevel++; continue }
      if (q && !matchesNote(note, kind, q)) { hiddenBySearch++; continue }
      visible.push(note)
    }
    // Newest first.
    visible.reverse()

    var unread = 0
    var readCount = 0
    for (var j = 0; j < visible.length; j++) {
      if (isUnread(visible[j])) unread++
      else readCount++
    }

    // Unread badge (header + tab) + tray mirror (Tauri shell).
    document.getElementById('unreadBadge').hidden = unread === 0
    document.getElementById('unreadBadge').textContent = String(unread)
    document.getElementById('tabInboxBadge').hidden = unread === 0
    document.getElementById('tabInboxBadge').textContent = String(unread)
    document.getElementById('ackAllBtn').disabled = unread === 0
    document.getElementById('groupBtn').textContent = inboxGrouped ? '平铺' : '分组'
    updateTrayUnread(unread)

    var hides = []
    if (hiddenByLevel > 0) hides.push('已按级别隐藏 ' + hiddenByLevel + ' 条')
    if (hiddenBySearch > 0) hides.push('已隐藏 ' + hiddenBySearch + ' 条匹配')
    lastInboxHint = hides.join(' · ')
    renderStatus()

    var sig = visible.map(noteSignature).join('\n') + (inboxGrouped ? '|g' : '')
    if (sig === lastInboxSig) return
    lastInboxSig = sig

    // Preserve the scroll position across rebuilds — captured before clearing,
    // restored AFTER the rows are appended (an empty list clamps scrollTop to 0).
    var prevScroll = list.scrollTop
    list.innerHTML = ''
    if (visible.length === 0) {
      empty.hidden = false
      empty.innerHTML = q
        ? '<span class="big">⌕</span>没有匹配的通知<span class="sub">换个关键词试试</span>'
        : '<span class="big">✓</span>没有需要处理的事项<span class="sub">待处理通知会出现在这里</span>'
      return
    }
    empty.hidden = true

    // All unread items regardless of position (a resolved-but-unacked record
    // may sit above an older unread one — a plain `break` would drop it).
    var unreadItems = []
    for (var k = 0; k < visible.length; k++) {
      if (isUnread(visible[k])) unreadItems.push(visible[k])
    }

    if (inboxGrouped && unreadItems.length > 0) {
      // Group unread items by session, preserving first-seen order.
      var groups = []
      var gmap = {}
      for (var gi = 0; gi < unreadItems.length; gi++) {
        var gitem = unreadItems[gi]
        var g = gmap[gitem.sessionId]
        if (!g) {
          g = { sessionId: gitem.sessionId, title: gitem.title || gitem.sessionId, items: [] }
          gmap[gitem.sessionId] = g
          groups.push(g)
        }
        g.items.push(gitem)
      }
      for (var gh = 0; gh < groups.length; gh++) {
        var grp = groups[gh]
        var open = groupOpen[grp.sessionId] !== false
        var head = document.createElement('button')
        head.className = 'ngroupHead' + (open ? ' open' : '')
        head.innerHTML =
          '<span class="ngroupChevron">▸</span>' +
          '<span class="gtitle">' + esc(grp.title) + '</span>' +
          '<span class="ngroupCount">' + grp.items.length + '</span>'
        head.addEventListener('click', (function (sid) {
          return function () {
            groupOpen[sid] = !(groupOpen[sid] !== false)
            lastInboxSig = null
            renderInbox()
          }
        })(grp.sessionId))
        list.appendChild(head)
        if (open) {
          var body = document.createElement('div')
          body.className = 'ngroupBody'
          for (var gr = 0; gr < grp.items.length; gr++) body.appendChild(noteRow(grp.items[gr]))
          list.appendChild(body)
        }
      }
    } else {
      for (var k2 = 0; k2 < unreadItems.length; k2++) list.appendChild(noteRow(unreadItems[k2]))
    }
    if (readCount > 0) {
      var group = document.createElement('div')
      group.className = 'readGroup'
      var toggle = document.createElement('button')
      toggle.className = 'readToggle'
      var open = false
      toggle.textContent = '── 已读 (' + readCount + ') ▸'
      var wrap = document.createElement('div')
      wrap.hidden = true
      for (var m = 0; m < visible.length; m++) {
        var done = visible[m]
        if (isUnread(done)) continue
        wrap.appendChild(noteRow(done))
      }
      toggle.addEventListener('click', function () {
        open = !open
        wrap.hidden = !open
        toggle.textContent = '── 已读 (' + readCount + ') ' + (open ? '▾' : '▸')
      })
      group.appendChild(toggle)
      group.appendChild(wrap)
      list.appendChild(group)
    }
    list.scrollTop = prevScroll
  }
  var lastInboxSig = null

  function noteRow(note) {
    var kind = KINDS[note.kind] || KINDS.done
    var read = !isUnread(note)
    var el = document.createElement('div')
    el.className = 'nrow ' + (read ? 'read' : 'unread')
    el.style.setProperty('--accent', kind.color)
    var round = note.round ? '<span class="round">第 ' + note.round + ' 轮</span>' : ''
    var resolvedTag = note.resolved ? '<span class="tag resolved">已处理</span>' : ''
    var actions = read ? ''
      : '<button class="act primary">处理</button><button class="act">忽略</button>'
    el.innerHTML =
      '<span class="icon">' + kind.icon + '</span>' +
      '<div class="main">' +
        '<div class="kindRow"><span class="kind">' + esc(kind.label) + '</span>' +
          '<span class="tag ' + kind.level + '">' + kind.level.toUpperCase() + '</span>' +
          round + resolvedTag + '</div>' +
        '<div class="sessTitle">' + esc(note.title || note.sessionId) + '</div>' +
        '<div class="meta"><span class="time">' + esc(relTime(note.at, Date.now())) + '</span>' +
          '<span class="actions">' + actions + '</span></div>' +
      '</div>'
    var primary = el.querySelector('.act.primary')
    if (primary) primary.addEventListener('click', function (ev) {
      ev.stopPropagation()
      handleNote(note)
    })
    var ignore = el.querySelector('.act:not(.primary)')
    if (ignore) ignore.addEventListener('click', function (ev) {
      ev.stopPropagation()
      ackNote(note.id)
    })
    el.addEventListener('click', function () {
      if (!read) handleNote(note)
    })
    el.title = note.sessionId
    return el
  }

  /** 处理: jump to the session (existing jump queue), then ack per setting. */
  function handleNote(note) {
    openSession(note.sessionId)
    if (shared.ackOnJump !== false) ackNote(note.id)
  }

  /** Ack one record locally + persist to the Host store. */
  function ackNote(id) {
    for (var i = 0; i < notes.length; i++) {
      if (notes[i].id === id && !notes[i].ackedAt) {
        notes[i] = Object.assign({}, notes[i], { ackedAt: Date.now() })
      }
    }
    lastInboxSig = null
    renderInbox()
    fetchJSON(NOTIFICATIONS_ACK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: [id] }),
    }).catch(function () {})
  }

  /** Ack every record (button + autoAckOnOpen). */
  function ackAll() {
    var now = Date.now()
    var changed = false
    notes = notes.map(function (note) {
      if (note.ackedAt || note.resolved) return note
      changed = true
      return Object.assign({}, note, { ackedAt: now })
    })
    if (changed) {
      lastInboxSig = null
      renderInbox()
    }
    fetchJSON(NOTIFICATIONS_ACK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ all: true }),
    }).catch(function () {})
  }

  function setTab(next) {
    tab = next
    document.getElementById('tabInbox').classList.toggle('active', next === 'inbox')
    document.getElementById('tabSessions').classList.toggle('active', next === 'sessions')
    document.getElementById('inboxView').hidden = next !== 'inbox'
    document.getElementById('sessionView').hidden = next !== 'sessions'
  }

  // ── round-completion toasts ──────────────────────────────────
  var REASON_KINDS = { error: true, aborted: true, blocked: true, 'max-tokens': true, interrupted: true }

  var TOAST_COPY = {
    done:         { icon: '✓', title: '完成一轮' },
    approval:     { icon: '⏳', title: '等待审批' },
    question:     { icon: '❓', title: '等待回答' },
    'plan-review':{ icon: '📋', title: '等待审阅计划' },
    subagent:     { icon: '⇄', title: '子代理完成' },
    error:        { icon: '✕', title: '本轮出错' },
    aborted:      { icon: '⏹', title: '已中止' },
    blocked:      { icon: '⚠', title: '已阻塞' },
    'max-tokens': { icon: '⛶', title: 'Token 上限' },
    interrupted:  { icon: '⏸', title: '已中断' },
  }

  function mapReason(reason) {
    return reason !== undefined && REASON_KINDS[reason] ? reason : 'done'
  }

  function onRoundFinished(row) {
    if (shared.notify === false) return
    var record = reasons[row.sessionId]
    var kind = row.pending === 'approval' ? 'approval' : mapReason(record ? record.reason : undefined)
    var round = record ? record.round : undefined
    if (round !== undefined) {
      var last = lastToastedRound[row.sessionId] || 0
      if (round <= last) return
      lastToastedRound[row.sessionId] = round
    }
    pushToast(kind, row, round)
  }

  function pushToast(kind, row, round) {
    var copy = TOAST_COPY[kind] || TOAST_COPY.done
    var el = document.createElement('div')
    el.className = 'toast toast' + kind.charAt(0).toUpperCase() + kind.slice(1).replace('-', '')
    el.dataset.seq = String(++toastSeq)
    el.innerHTML =
      '<div class="toastHead">' +
        '<span class="toastTitle"><span class="toastIcon">' + copy.icon + '</span>' + esc(copy.title) + '</span>' +
        '<span class="toastTime">' + clock() + '</span>' +
      '</div>' +
      '<div class="toastBody">' + esc(row.title || row.sessionId) + (round !== undefined ? ' · 第 ' + round + ' 轮' : '') + '</div>' +
      '<div class="toastActions">' +
        '<button class="jumpBtn">跳转</button>' +
        '<button class="dismissBtn">知道了</button>' +
      '</div>'
    el.querySelector('.jumpBtn').addEventListener('click', function () { openSession(row.sessionId) })
    el.querySelector('.dismissBtn').addEventListener('click', function () { removeToast(el) })
    document.getElementById('toasts').appendChild(el)

    if (shared.sound) playChime()

    if (shared.notifyMode !== 'confirm') {
      var dismissMs = (Number(shared.autoDismissSec) || 8) * 1000
      setTimeout(function () { removeToast(el) }, dismissMs)
    }
    trimToasts()
  }

  function trimToasts() {
    var box = document.getElementById('toasts')
    var cap = shared.notifyMode === 'confirm' ? MAX_CONFIRM_TOASTS : MAX_AUTO_TOASTS
    while (box.children.length > cap) removeToast(box.firstChild)
  }

  function playChime() {
    try {
      var AudioCtor = window.AudioContext || window.webkitAudioContext
      if (!AudioCtor) return
      // One shared context per page, never closed — browsers/WebView2 cap
      // concurrent AudioContexts (~6 per page); creating one per toast would
      // silently exhaust that pool under a toast burst.
      var actx = chimeCtx || new AudioCtor()
      chimeCtx = actx
      // Chimes are not triggered by a user gesture, so the context may be
      // suspended by the autoplay policy — request a resume (may still be
      // refused, which is fine: the chime simply stays silent).
      if (actx.state === 'suspended') {
        var resume = actx.resume()
        if (resume && typeof resume.catch === 'function') resume.catch(function () {})
      }
      var t = actx.currentTime
      ;[880, 1320].forEach(function (freq, i) {
        var osc = actx.createOscillator()
        var gain = actx.createGain()
        osc.type = 'sine'
        osc.frequency.value = freq
        gain.gain.setValueAtTime(0.001, t + i * 0.14)
        gain.gain.exponentialRampToValueAtTime(0.18, t + i * 0.14 + 0.02)
        gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.14 + 0.28)
        osc.connect(gain)
        gain.connect(actx.destination)
        osc.start(t + i * 0.14)
        osc.stop(t + i * 0.14 + 0.3)
      })
    } catch (e) { /* audio unavailable */ }
  }

  // ── sessions rendering (original monitor) ────────────────────
  var lastSig = null

  /** Stable per-row signature: re-render only when something visible changed
   *  (status, title, badges, executing-tool name, goal round/cap,
   *  minute-granularity recency) — otherwise a 2s poll with many sessions
   *  would rebuild the whole DOM every cycle and the list would flicker /
   *  jump. */
  function rowSignature(row) {
    var last = Math.max(row.updatedAt, row.lastActive)
    var tool = tools[row.sessionId]
    var goalSig = row.goal ? row.goal.phase + ':' + (row.goal.roundsStarted || 0) + '/' + (row.goal.maxGoalRounds || 0) : ''
    return [
      row.sessionId, row.running ? 1 : 0, row.title || '', row.subagents,
      row.pending ? 1 : 0, Math.floor(last / 60000), tool ? tool.name : '', goalSig,
    ].join('|')
  }

  function renderSessions() {
    var rows = sessions.slice()
    var now = Date.now()

    // Before the first successful fetch: loading placeholder (once the banner
    // is up, a retrying hint instead of a fake "no sessions").
    if (!loaded.sessions) {
      var list0 = document.getElementById('sessionList')
      var empty0 = document.getElementById('sessionEmpty')
      list0.innerHTML = ''
      empty0.hidden = false
      empty0.innerHTML = failCount >= 2
        ? '<span class="big">⛔</span>连接失败<span class="sub">正在重试…</span>'
        : '<span class="big">…</span>加载中'
      lastSessionHint = ''
      renderStatus()
      return
    }

    // In-view search (session title / id).
    var q = (search.sessions || '').toLowerCase()
    if (q) {
      rows = rows.filter(function (row) {
        return (row.title || row.sessionId).toLowerCase().indexOf(q) !== -1
      })
    }

    // Base filter (mirrors the web widget's `live` set): hide blank (never-run)
    // sessions and subagent rows unless enabled.
    var live = rows.filter(function (row) {
      if (row.blank) return false
      if (row.origin === 'subagent' && !shared.showSubagents) return false
      return true
    })

    // Busy rows (still doing work while the session itself is not in a turn:
    // running subagents, or a pending approval) are treated like running rows —
    // ranked on top and never hidden by the time window or busy-only. Same
    // semantics as the web widget's busyIds (the snapshot only carries the
    // approval pending; question/plan-review are covered by the inbox).
    var busy = {}
    for (var i = 0; i < live.length; i++) {
      var b = live[i]
      if (b.running) continue
      if (b.pending || (b.subagents || 0) > 0) busy[b.sessionId] = true
    }

    // Time window: running and busy sessions are always recent; the rest keep
    // only sessions active within the window ("recent" = max(updatedAt,
    // lastActive), the newest log event — the same rule the web widget applies
    // with its own observed-activity map).
    var windowMs = Number(shared.timeWindowMin) * 60 * 1000
    var inWindow = windowMs > 0
      ? live.filter(function (row) {
          if (row.running || busy[row.sessionId]) return true
          var last = Math.max(row.updatedAt, row.lastActive)
          return now - last <= windowMs
        })
      : live

    // Busy-only keeps running AND busy rows, hiding only genuinely idle ones.
    var visible = shared.runningOnly
      ? inWindow.filter(function (row) { return row.running || busy[row.sessionId] })
      : inWindow

    // Sort: running (and busy) first, then most recently active.
    visible.sort(function (a, b) {
      var aBusy = a.running || busy[a.sessionId]
      var bBusy = b.running || busy[b.sessionId]
      if (aBusy !== bBusy) return aBusy ? -1 : 1
      return Math.max(b.updatedAt, b.lastActive) - Math.max(a.updatedAt, a.lastActive)
    })

    // The "hidden" hint counts time-window hides only — in busy-only mode idle
    // rows are hidden by that switch, not by time (same rule as the web
    // widget; blank/subagent filters are not "older sessions" either).
    var hidden = shared.runningOnly ? 0 : live.length - visible.length

    var runningCount = visible.filter(function (r) { return r.running }).length
    var parts = [runningCount + ' 运行中', visible.length + ' 显示']
    if (hidden > 0) parts.push('已隐藏 ' + hidden + ' 个更早')
    lastSessionHint = parts.join(' · ')
    renderStatus()

    // Diff: keep the DOM untouched when the visible rows are unchanged.
    var sig = visible.map(rowSignature).join('\n') + (q ? '|q' : '')
    if (sig === lastSig) return
    lastSig = sig

    // Preserve the scroll position across rebuilds — the signature changes
    // every minute (minute-granularity recency), and a full rebuild without
    // this would jump a scrolled list back to the top.
    var list = document.getElementById('sessionList')
    var prevScroll = list.scrollTop
    list.innerHTML = ''
    for (var k = 0; k < visible.length; k++) {
      list.appendChild(rowEl(visible[k], now))
    }
    list.scrollTop = prevScroll
    var sem = document.getElementById('sessionEmpty')
    sem.hidden = visible.length > 0
    if (!sem.hidden) {
      sem.innerHTML = q
        ? '<span class="big">⌕</span>没有匹配的会话<span class="sub">换个关键词试试</span>'
        : '<span class="big">·</span>暂无活动会话<span class="sub">运行中的会话会置顶显示</span>'
    }
  }

  function rowEl(row, now) {
    var el = document.createElement('div')
    el.className = 'row'
    var dotClass = row.running ? 'dotRunning' : (row.pending ? 'dotPending' : 'dotDone')
    var statusText, statusClass = ''
    if (row.running) statusText = '运行中'
    else if (row.subagents > 0) { statusText = '子代理运行中'; statusClass = ' statusSub' }
    else if (row.pending) statusText = '等待审批'
    else statusText = '空闲'

    var meta = '<span class="status' + statusClass + '">' + esc(statusText) + '</span>'
    if (row.subagents > 0) meta += '<span class="badgeSm subBadge">子×' + row.subagents + '</span>'
    if (row.pending) meta += '<span class="badgeSm pendingBadge">⏳ 待审批</span>'

    // Task-execution progress: a thin animated bar + a label naming what is
    // executing. Running rows name the current model tool call (Host-tracked)
    // and the in-progress round; subagent rows name the child count. GOAL
    // MODE overrides: when the row carries a goal (phase != complete) the bar
    // is DETERMINATE — roundsStarted / maxGoalRounds as a real percentage —
    // and the label reads 「目标 第 X/Y 轮」(+ tool while running). Paused /
    // blocked goals stay visible even on idle rows.
    var goal = row.goal
    var goalActive = goal && goal.phase !== 'complete'
    var goalPausedOrBlocked = goalActive && (goal.phase === 'paused' || goal.phase === 'blocked')
    var goalPct = goalActive && goal.maxGoalRounds > 0
      ? Math.min(100, Math.round(((goal.roundsStarted || 0) / goal.maxGoalRounds) * 100))
      : undefined
    var progress = ''
    if (row.running || row.subagents > 0 || goalPausedOrBlocked) {
      var barCls
      var label
      if (goalActive) {
        var gRound = goal.roundsStarted || 0
        var gCap = goal.maxGoalRounds || 0
        if (goal.phase === 'blocked') {
          barCls = ' progressGoalBlocked'
          label = '目标受阻 · 第 ' + gRound + '/' + gCap + ' 轮'
        } else if (goal.phase === 'paused') {
          barCls = ' progressGoalPaused'
          label = '目标已暂停 · 第 ' + gRound + '/' + gCap + ' 轮'
        } else {
          barCls = ' progressGoal'
          var tool = tools[row.sessionId]
          label = tool
            ? '目标 第 ' + gRound + '/' + gCap + ' 轮 · 正在执行 ' + esc(tool.name)
            : '目标 第 ' + gRound + '/' + gCap + ' 轮'
        }
      } else if (row.running) {
        barCls = ' progressRunning'
        // In-progress round = cumulative finished-round count + 1 (the count
        // is not TTL-pruned, so long turns stay accurate); fall back to the
        // reason record's round, then 0.
        var count = roundCounts[row.sessionId]
        var recRound = count !== undefined
          ? count
          : (reasons[row.sessionId] && typeof reasons[row.sessionId].round === 'number'
              ? reasons[row.sessionId].round
              : 0)
        var round = recRound + 1
        var tool = tools[row.sessionId]
        label = tool
          ? '第 ' + round + ' 轮 · 正在执行 ' + esc(tool.name)
          : '第 ' + round + ' 轮'
      } else {
        barCls = ' progressSub'
        label = row.subagents + ' 个子代理执行中'
      }
      var fill = goalPct !== undefined
        ? '<div class="progressFill" style="width:' + goalPct + '%"></div>'
        : ''
      progress =
        '<div class="progress">' +
          '<div class="progressBar' + barCls + '">' + fill + '</div>' +
          '<div class="progressLabel">' + label + '</div>' +
        '</div>'
    }

    el.innerHTML =
      '<span class="dot ' + dotClass + '"></span>' +
      '<div class="rowMain">' +
        '<div class="rowTitle">' + esc(row.title || '未命名会话') + '</div>' +
        '<div class="rowMeta">' + meta + '</div>' +
        progress +
      '</div>' +
      '<span class="time">' + esc(relTime(Math.max(row.updatedAt, row.lastActive), now)) + '</span>'
    el.addEventListener('click', function () { openSession(row.sessionId) })
    el.title = row.sessionId
    return el
  }

  function renderPin() {
    document.getElementById('pinBtn').classList.toggle('on', !!pinOn)
    document.getElementById('pinBtn').title = pinOn ? '取消置顶' : '置顶'
  }

  /** Show/hide the "monitoring off" overlay (covers the views; the header and
   *  the settings popover stay reachable) and refresh the footer status. */
  function renderMonitor() {
    var off = isMonitorOff()
    document.getElementById('monitorOff').hidden = !off
    renderStatus()
  }

  function render() {
    renderPin()
    renderMonitor()
    renderSessions()
    renderInbox()
  }

  // ── jump to a session (server-mediated) ───────────────────────
  /** Post a jump request; the open Harness web tab consumes it and switches
   *  in place. Fall back to the system browser (with a boot deep link) when
   *  nothing consumed it in time — wait longer when a web tab is alive (it
   *  polls ~1s), fall back quickly when none is. */
  function openSession(sessionId) {
    var url = location.origin + '/?dsh-open=' + encodeURIComponent(sessionId)
    fetchJSON(JUMP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: sessionId }),
    }).then(function (res) {
      var webAlive = !!(res && res.webAlive)
      // Alive: the web tab polls ~1s (long-poll, actually) — wait up to ~4.8s.
      // Dead: give it a short 2.4s grace for a just-opened tab, then fall back.
      var maxAttempts = webAlive ? 12 : 6
      return new Promise(function (resolve) {
        var attempts = 0
        var timer = setInterval(function () {
          attempts++
          fetchJSON(JUMP_URL).then(function (res) {
            var value = res && res.value
            if (value && value.consumed) { clearInterval(timer); resolve(true) }
            else if (attempts >= maxAttempts) { clearInterval(timer); resolve(false) }
          }).catch(function () {
            if (attempts >= maxAttempts) { clearInterval(timer); resolve(false) }
          })
        }, 400)
      })
    }).then(function (consumed) {
      if (!consumed) openBrowser(url)
    }).catch(function () {
      openBrowser(url)
    })
  }

  // ── helpers ───────────────────────────────────────────────────
  function esc(text) {
    return String(text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
  }

  function relTime(ts, now) {
    if (!ts) return ''
    var diff = Math.max(0, now - ts)
    if (diff < 60 * 1000) return '刚刚'
    var min = Math.floor(diff / 60000)
    if (min < 60) return min + ' 分钟前'
    var hour = Math.floor(min / 60)
    if (hour < 24) return hour + ' 小时前'
    var d = new Date(ts)
    var pad = function (n) { return (n < 10 ? '0' : '') + n }
    return (d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes())
  }

  function clock(ts) {
    var d = ts ? new Date(ts) : new Date()
    var pad = function (n) { return (n < 10 ? '0' : '') + n }
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds())
  }

  /** Footer status line: connection + last-sync time, appended to the hint. */
  function statusText() {
    if (isMonitorOff()) return '⏸ 监控已关闭'
    if (paused) return '⏸ 暂停中'
    if (failCount >= 2) return '⛔ 连接失败'
    if (lastSyncAt > 0) {
      var stale = Date.now() - lastSyncAt
      return (stale < 8000 ? '● 已连接' : '◌ 同步中') + ' ' + clock(lastSyncAt)
    }
    return '◌ 连接中'
  }

  function composeHint(base) {
    var status = statusText()
    return base ? base + ' · ' + status : status
  }

  /** Refresh both footer hints with the current status (called after every
   *  poll so the clock stays fresh even when the list DOM did not change). */
  function renderStatus() {
    var ih = document.getElementById('inboxFooterHint')
    if (ih) ih.textContent = composeHint(lastInboxHint)
    var sh = document.getElementById('sessionFooterHint')
    if (sh) sh.textContent = composeHint(lastSessionHint)
  }

  /** Remove a toast with a short exit animation. */
  function removeToast(el) {
    if (!el || !el.isConnected) return
    el.classList.add('out')
    setTimeout(function () { if (el.isConnected) el.remove() }, 180)
  }

  // ── wiring ────────────────────────────────────────────────────
  function init() {
    var header = document.getElementById('header')
    header.classList.add('draggable')
    header.addEventListener('pointerdown', startDrag)

    document.getElementById('pinBtn').addEventListener('click', togglePin)
    document.getElementById('closeBtn').addEventListener('click', hideWindow)
    document.getElementById('settingsBtn').addEventListener('click', function () {
      var panel = document.getElementById('settingsPanel')
      panel.hidden = !panel.hidden
      if (!panel.hidden) { pollSettings(); applyPanelUI() }
    })
    document.getElementById('tabInbox').addEventListener('click', function () { setTab('inbox') })
    document.getElementById('tabSessions').addEventListener('click', function () { setTab('sessions') })
    document.getElementById('ackAllBtn').addEventListener('click', ackAll)

    // Re-enable from the "monitoring off" overlay (one click, same shared
    // setting as the panel checkbox — the web side picks it up via the store).
    document.getElementById('monitorOffEnable').addEventListener('click', function () {
      saveSharedSettings({ desktopMonitor: true })
    })

    // Manual refresh (header): immediate re-poll with a short spin feedback.
    var refreshBtn = document.getElementById('refreshBtn')
    refreshBtn.addEventListener('click', function () {
      refreshBtn.classList.add('spinning')
      setTimeout(function () { refreshBtn.classList.remove('spinning') }, 500)
      pollSettings()
      if (!isMonitorOff()) pollAll()
      renderStatus()
    })

    // Per-view search (client-side filter of the already-fetched data).
    document.getElementById('inboxSearch').addEventListener('input', function (e) {
      search.inbox = e.target.value
      lastInboxSig = null
      renderInbox()
    })
    document.getElementById('sessionSearch').addEventListener('input', function (e) {
      search.sessions = e.target.value
      lastSig = null
      renderSessions()
    })

    // Inbox group-by-session toggle (desktop-local, persisted).
    document.getElementById('groupBtn').addEventListener('click', function () {
      inboxGrouped = !inboxGrouped
      saveCache()
      lastInboxSig = null
      renderInbox()
    })

    document.getElementById('resetBtn').addEventListener('click', function () {
      var fresh = {}
      for (var key in DEFAULTS) fresh[key] = DEFAULTS[key]
      saveSharedSettings(fresh)
      for (var lvl in LEVEL_DEFAULTS) inboxLevels[lvl] = LEVEL_DEFAULTS[lvl]
      pollMs = POLL_DEFAULT_MS
      saveCache()
      applyEffective()
      applyPanelUI()
      render()
    })

    function bindCheck(id, key) {
      document.getElementById(id).addEventListener('change', function (e) {
        var patch = {}
        patch[key] = e.target.checked
        saveSharedSettings(patch)
      })
    }
    function bindNumber(id, key) {
      document.getElementById(id).addEventListener('change', function (e) {
        var v = parseInt(e.target.value, 10)
        if (!Number.isFinite(v)) return
        var patch = {}
        patch[key] = Math.max(0, v)
        saveSharedSettings(patch)
      })
    }
    bindCheck('setNotify', 'notify')
    bindCheck('setDesktopMonitor', 'desktopMonitor')
    bindCheck('setSound', 'sound')
    bindCheck('setRunningOnly', 'runningOnly')
    bindCheck('setSubagents', 'showSubagents')
    bindCheck('setAckOnJump', 'ackOnJump')
    bindCheck('setAutoAckOnOpen', 'autoAckOnOpen')
    bindNumber('setAutoDismiss', 'autoDismissSec')
    bindNumber('setWindow', 'timeWindowMin')
    document.getElementById('setNotifyMode').addEventListener('change', function (e) {
      saveSharedSettings({ notifyMode: e.target.value === 'confirm' ? 'confirm' : 'auto' })
    })

    // Desktop-local inbox level toggles.
    function bindLevel(id, lvl) {
      document.getElementById(id).addEventListener('change', function (e) {
        inboxLevels[lvl] = e.target.checked
        saveCache()
        lastInboxSig = null
        renderInbox()
      })
    }
    bindLevel('setInboxP0', 'p0')
    bindLevel('setInboxP1', 'p1')
    bindLevel('setInboxP2', 'p2')

    document.getElementById('setPoll').addEventListener('change', function (e) {
      pollMs = parseInt(e.target.value, 10) || POLL_DEFAULT_MS
      saveCache()
      applyEffective()
    })

    // Initial pin state from the window (Tauri only), plus hidden-window
    // pause wiring: the shell emits smon-window-hidden/shown on tray
    // hide/show, and a boot-hidden window (start-to-tray) starts paused
    // (with one immediate notifications fetch so the tray badge appears).
    if (tauri) {
      currentWindow().isAlwaysOnTop().then(function (on) {
        pinOn = on
        renderPin()
      }).catch(function () {})
      currentWindow().isVisible().then(function (v) {
        if (!v) { pollNotifications(); setPaused(true) }
      }).catch(function () {})
      tauri.event.listen('smon-window-hidden', function () { setPaused(true) }).catch(function () {})
      tauri.event.listen('smon-window-shown', function () { setPaused(false) }).catch(function () {})
    }
    // Plain-browser fallback: pause when the tab goes hidden, resume on return.
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) setPaused(true)
      else setPaused(false)
    })

    loadCache()
    applyEffective()
    applyPanelUI()
    setTab('inbox')
    // Render the loading placeholders immediately (the first polls are async;
    // without this the static empty states flash for a moment).
    renderInbox()
    renderSessions()
    renderMonitor()
    renderStatus()
    pollSettings()
    if (!isMonitorOff()) pollAll()
    if (settingsTimer) clearInterval(settingsTimer)
    settingsTimer = setInterval(pollSettings, SETTINGS_SYNC_MS)
  }

  document.addEventListener('DOMContentLoaded', init)
  if (document.readyState === 'interactive' || document.readyState === 'complete') init()
})()
</script>
</body>
</html>
