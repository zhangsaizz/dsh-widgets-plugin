[package]
name = "dsh-session-monitor-desktop"
version = "0.1.0"
description = "Desktop floating session monitor for DeepSeek Harness: a frameless, always-on-top widget window that shows the live session list and round-completion toasts."
authors = ["dsh-widgets-plugin"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dsh_session_monitor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
opener = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
