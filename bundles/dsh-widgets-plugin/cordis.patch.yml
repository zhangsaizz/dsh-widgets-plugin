# The widgets bundle layer: inserts the one balance plugin (host balance seam
# + shipped vendors + web balance dashboard + its provider-bindings config
# panel, configured from the Widgets manager's Configure dialog), the floating
# token-crit meter, the session monitor dashboard, the card container (docks
# widgets into a tidy grid), and the Widgets manager settings page.
- insert:
    - id: balance
      name: '@dsh-plugins/balance'
      config:
        requestTimeoutMs: 10000
        # New API is self-hosted; point the /api/user/self balance query at the instance.
        newApiBaseURL: http://localhost:3000
        # Optional user-managed bindings. The shipped providers ALREADY bind
        # their default routes (deepseek-official / moonshot / openrouter /
        # siliconflow / new-api), so adding a binding for one of those routes
        # conflicts ("route already bound") and is skipped with a warning —
        # never a boot failure. Add a binding only for a route NOT already
        # covered — e.g. a self-hosted gateway under a custom provider route.
        # Use `credentialRef` (env-var / credential-store name) OR `credential`
        # (inline API key) — one of the two is enough.
        #
        # This field IS the plugin's settings section under harness 0.1.7
        # (`bindings` is a volatile Config field): entries written here and
        # entries saved from the Widgets manager's provider panel are the same
        # document, which is why the panel can show and edit them in place.
        # bindings:
        #   - provider: my-gateway
        #     vendor: deepseek
        #     credentialRef: MY_GATEWAY_KEY
        #     baseURL: http://localhost:8787
        bindings: []

    - id: ui-token-crit
      name: '@dsh-plugins/client-ui-token-crit'

    - id: ui-session-monitor
      name: '@dsh-plugins/client-ui-session-monitor'

    - id: ui-card-container
      name: '@dsh-plugins/client-ui-card-container'

    - id: ui-rainbow-flow
      name: '@dsh-plugins/client-ui-rainbow-flow'

    - id: ui-widget-manager
      name: '@dsh-plugins/client-ui-widget-manager'
