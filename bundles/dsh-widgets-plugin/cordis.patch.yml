# The widgets bundle layer: inserts the one balance plugin (host balance seam
# + shipped vendors + web balance dashboard + its provider-bindings config
# panel, configured from the Widgets manager's Configure dialog), the floating
# token-crit meter, the session monitor dashboard, and the Widgets manager
# settings page.
- insert:
    - id: balance
      name: '@dsh-plugins/balance'
      config:
        requestTimeoutMs: 10000
        # New API is self-hosted; point the /api/user/self balance query at the instance.
        newApiBaseURL: http://localhost:3000
        # Fill credentials directly here. Each entry answers one provider route;
        # use `credentialRef` (env-var / credential-store name) OR `credential`
        # (inline API key) — one of the two is enough.
        bindings: []
        # Example:
        # bindings:
        #   - provider: new-api
        #     vendor: new-api
        #     credential: sk-xxxxxxxx
        #     baseURL: http://localhost:3000
        #   - provider: deepseek-official
        #     vendor: deepseek
        #     credentialRef: DEEPSEEK_API_KEY

    - id: ui-token-crit
      name: '@dsh-plugins/client-ui-token-crit'

    - id: ui-session-monitor
      name: '@dsh-plugins/client-ui-session-monitor'

    - id: ui-widget-manager
      name: '@dsh-plugins/client-ui-widget-manager'
